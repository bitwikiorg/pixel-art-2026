<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07110f">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true"></span>
      <span><strong>MPF</strong><small>RESEARCH FIELD // 2026</small></span>
    </a>
    <nav class="top-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}#thesis">Thesis</a>
      <a href="{{ '/experiment/' | relative_url }}">Experiment</a>
      <a href="{{ '/research/' | relative_url }}">Library</a>
      <a href="https://github.com/bitwikiorg/pixel-art-2026">GitHub</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer class="site-footer">
    <div><span class="pulse"></span> OPEN RESEARCH // CLAIMS REQUIRE ABLATION</div>
    <div>BITWIKI · MULTIDIMENSIONAL PIXEL FIELDS</div>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {% if page.field_lab %}<script src="{{ '/assets/js/field.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
