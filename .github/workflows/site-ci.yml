name: Validate Pixel Photon Lab

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Set up Python lint
        run: python3 -m pip install --disable-pip-version-check ruff==0.11.13

      - name: Lint JavaScript syntax
        run: find assets/js scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run JavaScript behavioral tests
        run: |
          node scripts/test-pixel-core.js
          node scripts/test-color-carrier.js
          node scripts/test-relation-task.js
          node scripts/test-webgpu-field.js
          node scripts/test-masked-reconstruction.js
          node scripts/test-pixel-genome.js
          node scripts/test-pixel-organism.js
          node scripts/test-pixel-universe.js

      - name: Lint and compile Python
        run: |
          ruff check --select F,E9 experiments scripts
          python3 -m compileall -q experiments scripts

      - name: Audit experiment registry
        run: python3 scripts/audit_experiments.py

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Audit rendered experiment registry
        run: python3 scripts/audit_experiments.py

      - name: Validate rendered output, links, fragments and IDs
        run: python3 scripts/validate_site.py
