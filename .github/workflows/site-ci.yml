name: Validate Pixel Neural Net Lab

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/site.js
          node --check assets/js/field.js
          node --check assets/js/neural-field.js

      - name: Check Python experiment syntax
        run: |
          python3 -m py_compile experiments/mpf_relations.py scripts/validate_site.py

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Validate rendered output and internal links
        run: python3 scripts/validate_site.py
